name: Update dev branch

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Create PR main -> dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Controlla se esiste già una PR main -> dev
          EXISTING_PR=$(gh pr list \
            --base dev \
            --head main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            echo "Creo la PR..."

            PR_URL=$(gh pr create \
              --base dev \
              --head main \
              --title "up-to-date dev branch" \
              --body $'⚠️ Auto Merge PR\n**Questo verrà mergiato automaticamente**')

            echo "PR creata: $PR_URL"

            gh pr merge "$PR_URL" \
              --merge \
              --auto
          else
            echo "PR già esistente: #$EXISTING_PR"

            gh pr merge "$EXISTING_PR" \
              --merge \
              --auto
          fi
