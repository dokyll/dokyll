name: Update dev branch

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dev:
    name: Update dev branch
    runs-on: ubuntu-latest

    steps:
      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔎 Controllo PR main -> dev..."

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base dev \
            --head main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR già esistente: #$EXISTING_PR"

            gh pr merge "$EXISTING_PR" \
              --repo "${{ github.repository }}" \
              --merge \
              --auto

            exit 0
          fi

          echo "🚀 Creo la PR main -> dev..."

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base dev \
            --head main \
            --title "up-to-date dev branch" \
            --body $'⚠️ Auto Merge PR\n**Questo verrà mergiato automaticamente**')

          echo "✅ PR creata: $PR_URL"

          echo "🔀 Abilito Auto Merge..."

          gh pr merge "$PR_URL" \
            --repo "${{ github.repository }}" \
            --merge \
            --auto

          echo "✅ Auto Merge configurato!"
